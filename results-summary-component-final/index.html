<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>

  <div class="card">

    <!-- LEFT: Your Result -->
    <section class="result">
      <h1 class="result__title">Your Result</h1>

      <div class="result__circle">
        <p class="result__score">76</p>
        <p class="result__total">of 100</p>
      </div>

      <div class="result__rating">
        <p class="result__rank">Great</p>
        <p class="result__description">
          You scored higher than 65% of the people<br>who have taken these tests.
        </p>
      </div>
    </section>

    <!-- RIGHT: Summary — populated by JavaScript from data.json -->
    <section class="summary">
      <h2 class="summary__title">Summary</h2>
      <ul class="summary__list" id="summary-list"></ul>
      <button class="btn-continue">Continue</button>
    </section>

  </div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Tebu Thobejane</a>.
  </div>

  <script src="script.js"></script>

</body>
</html>
